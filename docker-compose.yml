name: bexio-mcp

# .env next to this file (chmod 600): PUBLIC_URL, BEXIO_CLIENT_ID and
# BEXIO_CLIENT_SECRET (the bexio app this server signs users in with),
# HOST_PORT (loopback port the reverse proxy or tunnel forwards to), and
# optionally IMAGE to run a released image (ghcr.io/<owner>/bexio-mcp:<version>).
services:
  mcp:
    build: .
    image: ${IMAGE:-bexio-mcp:latest}
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      BEXIO_CLIENT_ID: ${BEXIO_CLIENT_ID:?set BEXIO_CLIENT_ID in .env}
      BEXIO_CLIENT_SECRET: ${BEXIO_CLIENT_SECRET:?set BEXIO_CLIENT_SECRET in .env}
      # Optional error reporting; off when empty.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      # Go's own soft limit; also holds where the kernel ignores mem_limit
      # (Raspberry Pi OS boots with cgroup_disable=memory).
      GOMEMLIMIT: 400MiB
    # Loopback only: the tunnel or reverse proxy is the sole way in.
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    # Stateless and unprivileged: nothing writable, no capabilities, no way
    # to gain privileges, bounded resources.
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 0.5
    ulimits:
      nofile: { soft: 1024, hard: 1024 }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
